name: restaurant_mobile
description: "Kings of Wings - First-Class Flutter Restaurant SaaS Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase & Backend Services
  supabase_flutter: ^2.8.0
  http: ^1.2.2

  # State Management & Navigation
  provider: ^6.1.2
  go_router: ^14.6.2

  # UI, Icons, Typography & Feedback
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  intl: ^0.19.0
  cached_network_image: ^3.4.1

  # Local Persistence & Secure Cache
  shared_preferences: ^2.3.3

  # Hardware, Deep Linking & Device Capabilities
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
